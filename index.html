<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
    <title>天都·曲措</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #0a0a09; color: #e8e4d6; }
      #startup-splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #0a0a09; transition: opacity 180ms ease;
      }
      #startup-splash.is-hidden { opacity: 0; pointer-events: none; }
      .startup-seal {
        padding: 12px 16px; border: 2px solid #c8323a; color: #c8323a;
        font: 24px/1.2 "Songti SC", "STSong", "SimSun", serif; letter-spacing: 4px;
        box-shadow: inset 0 0 0 2px #0a0a09, 0 0 0 1px #8a4a48;
      }
      .startup-caption { margin: 0; color: #8f8a7c; font: 11px/1.5 "Songti SC", "STSong", "SimSun", serif; }
      .startup-progress { width: 128px; height: 1px; overflow: hidden; background: #4a453c; }
      .startup-progress::after {
        display: block; width: 35%; height: 100%; background: #c8323a; content: "";
        animation: startup-progress 1.2s ease-in-out infinite alternate;
      }
      @keyframes startup-progress { from { transform: translateX(-100%); } to { transform: translateX(285%); } }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash { transition-duration: 0.01ms; }
        .startup-progress::after { animation: none; transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-live="polite" aria-label="曲措正在载入">
      <div class="startup-seal">曲措</div>
      <p class="startup-caption">山河入卷，稍候片刻</p>
      <div class="startup-progress" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
