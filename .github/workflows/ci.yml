name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs-gate
      - run: npm run verify
      - run: npm run ratchet
        env:
          # push 事件传推送前 tip——直推 main 抬上限与基线自比自蒙混的洞由此堵
          # （pull_request 事件此值为空串，ratchet 候选链自动回落目标分支/origin/main）
          RATCHET_BASE_REF: ${{ github.event.before }}
